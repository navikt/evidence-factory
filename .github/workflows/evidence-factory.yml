name: evidence-factory

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Baseline commit SHA/ref for scope diff (required for workflow_dispatch)"
        required: true
        type: string

jobs:
  build-evidence:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # for keyless signing on main

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version-file: .python-version

      - name: Install deps
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Install dev deps and run tests
        run: |
          pip install --require-hashes -r requirements-dev.txt
          python -m pytest tests/ -v

      - name: Set diff baseline
        id: baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_BASELINE="$(git merge-base ${{ github.event.pull_request.base.sha }} HEAD)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            DIFF_BASELINE="${{ github.event.before }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIFF_BASELINE="${{ inputs.baseline_ref }}"
          else
            echo "Cannot set a diff baseline for event '${{ github.event_name }}'. Next step: use pull_request, push, or workflow_dispatch with baseline_ref." >&2
            exit 1
          fi

          echo "diff_baseline=${DIFF_BASELINE}" >> "$GITHUB_OUTPUT"

      - name: Classify scope changes
        id: classify
        env:
          DIFF_BASELINE: ${{ steps.baseline.outputs.diff_baseline }}
        run: |
          # Evidence substitution control: prevents manually crafted evidence packs.
          # Do not add an exception path without security review.
          python scripts/classify_diff_scope.py

      - name: Install Conftest
        run: |
          curl -sSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.66.0/conftest_0.66.0_Linux_x86_64.tar.gz
          echo "7e717adada4ca64e600bdb86b789cbcc279215b3296e238bc291acbb81361d6f  conftest.tar.gz" | sha256sum --check
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Scope meta-policy gate
        run: conftest test classify-output.json --policy policy --namespace scope_meta

      - name: Policy unit tests (Rego)
        run: conftest verify --policy policy

      - name: Train
        if: steps.classify.outputs.triggers_ml == 'true'
        run: python src/train.py --out-dir build --seed 42

      - name: Eval
        if: steps.classify.outputs.triggers_ml == 'true'
        run: python src/eval.py --build-dir build --out build/eval.json

      - name: Prepare evidence directory
        if: steps.classify.outputs.triggers_ml == 'true'
        run: mkdir -p evidence

      # SBOM into evidence/
      - name: Generate SBOM (SPDX JSON)
        if: steps.classify.outputs.triggers_ml == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 #v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false

      # Vuln scan into evidence/
      - name: Trivy scan (repo filesystem)
        if: steps.classify.outputs.triggers_ml == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "evidence/trivy.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Assemble evidence pack
        if: steps.classify.outputs.triggers_ml == 'true'
        run: |
          python scripts/make_evidence_pack.py --build-dir build --evidence-dir evidence --out-tgz evidence/evidence-pack.tgz \
            --git-sha "${{ github.sha }}" \
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Policy gate (manifest)
        if: steps.classify.outputs.triggers_ml == 'true'
        run: conftest test evidence/manifest.json --policy policy --namespace evidence

      - name: Upload evidence artifacts
        if: steps.classify.outputs.triggers_ml == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: evidence-pack
          path: |
            evidence/evidence-pack.tgz
            evidence/manifest.json
            evidence/sbom.spdx.json
            evidence/trivy.sarif

      # Optional: keyless sign the bundle on main pushes
      - name: Install Cosign
        if: steps.classify.outputs.triggers_ml == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 #v4.1.0

      - name: Sign evidence pack (keyless)
        if: steps.classify.outputs.triggers_ml == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob --bundle evidence/evidence-pack.sigstore.json evidence/evidence-pack.tgz

      - name: Upload signature bundle
        if: steps.classify.outputs.triggers_ml == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: evidence-pack-signature
          path: evidence/evidence-pack.sigstore.json
